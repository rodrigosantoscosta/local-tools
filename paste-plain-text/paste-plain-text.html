<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Paste Plain Text</title>
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#fafafa; --surface:#fff; --ink:#111; --muted:#666; --line:#d4d4d4; --line-strong:#111; --invert:#fff;
  --font:"Helvetica Neue",Helvetica,Arial,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#0a0a0a;--surface:#141414;--ink:#f2f2f2;--muted:#999;--line:#333;--line-strong:#f2f2f2;--invert:#0a0a0a}
}
:root[data-theme="dark"]{--bg:#0a0a0a;--surface:#141414;--ink:#f2f2f2;--muted:#999;--line:#333;--line-strong:#f2f2f2;--invert:#0a0a0a}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
main{max-width:760px;margin:0 auto;padding:32px 20px 64px}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line-strong)}
.topbar-in{padding:9px 20px;display:flex;justify-content:flex-end}
.theme-btn{display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;padding:0}
.theme-btn .ic{width:18px;height:18px;flex:none}
.theme-btn .ic-moon{display:none}
.theme-btn.dark .ic-sun{display:none}
.theme-btn.dark .ic-moon{display:block}
h1{font-size:clamp(28px,6vw,40px);line-height:1.1;font-weight:700;letter-spacing:-.02em;margin:0 0 12px}
.lead{color:var(--muted);max-width:60ch;margin:0 0 32px}
.panel{background:var(--surface);border:1px solid var(--line-strong);border-radius:0}
.panel + .panel{margin-top:16px}
.panel-head{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 14px;border-bottom:1px solid var(--line);font-size:14px;font-weight:600}
.panel-head span:last-child{color:var(--muted);font-weight:400;font-family:var(--mono);font-size:13px}
textarea{display:block;width:100%;min-height:200px;padding:14px;border:0;background:transparent;color:var(--ink);font:15px/1.6 var(--font);resize:vertical;border-radius:0}
textarea::placeholder{color:var(--muted)}
textarea:focus{outline:none}
.panel:focus-within{outline:2px solid var(--ink);outline-offset:2px}
#out{font-family:var(--mono);font-size:14px;background:var(--bg)}
.bar{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
button{font:inherit;font-size:14px;font-weight:600;padding:10px 16px;border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);border-radius:0;cursor:pointer;min-height:44px}
button:hover{background:var(--ink);color:var(--invert)}
button.primary{background:var(--ink);color:var(--invert)}
button.primary:hover{background:var(--surface);color:var(--ink)}
button:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.opts{display:flex;flex-wrap:wrap;gap:8px 20px;margin-top:16px;font-size:14px}
.opts label{display:flex;align-items:center;gap:8px;cursor:pointer;min-height:28px}
input[type=checkbox]{appearance:none;width:18px;height:18px;border:1px solid var(--line-strong);background:var(--surface);margin:0;cursor:pointer;display:grid;place-content:center;border-radius:0}
input[type=checkbox]:checked{background:var(--ink)}
input[type=checkbox]:checked::after{content:"";width:8px;height:4px;border:solid var(--invert);border-width:0 0 2px 2px;transform:rotate(-45deg) translate(1px,-1px)}
input[type=checkbox]:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
#status{min-height:22px;margin-top:12px;font-size:14px;color:var(--muted)}
footer{margin-top:40px;padding-top:16px;border-top:1px solid var(--line);font-size:13px;color:var(--muted)}
</style>
</head>
<body>
<header class="topbar">
  <div class="topbar-in">
    <button class="theme-btn" id="theme" type="button">
      <svg class="ic ic-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
      <svg class="ic ic-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
    </button>
  </div>
</header>
<main>
  <h1>Paste Plain Text</h1>
  <p class="lead">Copy and paste text without formatting. Paste your content below and it will be converted to plain text. Then copy the result to your clipboard.</p>

  <section class="panel">
    <div class="panel-head"><label for="in">Paste here</label><span id="cin">0 characters</span></div>
    <textarea id="in" placeholder="Paste your formatted text (Ctrl+V / ⌘+V)" spellcheck="false"></textarea>
  </section>

  <div class="opts">
    <label><input type="checkbox" id="o-trim" checked> Trim leading/trailing spaces</label>
    <label><input type="checkbox" id="o-spaces"> Collapse repeated spaces</label>
    <label><input type="checkbox" id="o-breaks"> Remove extra line breaks</label>
    <label><input type="checkbox" id="o-lines"> Remove all line breaks</label>
  </div>

  <section class="panel" style="margin-top:16px">
    <div class="panel-head"><label for="out">Plain text</label><span id="cout">0 characters</span></div>
    <textarea id="out" readonly placeholder="Your plain text will appear here"></textarea>
  </section>

  <div class="bar">
    <button class="primary" id="copy" type="button">Copy plain text</button>
    <button id="paste" type="button">Paste from clipboard</button>
    <button id="clear" type="button">Clear</button>
  </div>
  <div id="status" role="status" aria-live="polite"></div>

  <footer>All processing happens in your browser. Nothing is sent to any server.</footer>
</main>

<script>
(function(){
  var $=function(id){return document.getElementById(id)};
  var input=$("in"),output=$("out"),status=$("status"),timer;

  function say(msg){
    status.textContent=msg;
    clearTimeout(timer);
    timer=setTimeout(function(){status.textContent=""},2500);
  }
  function count(n){return n+(n===1?" character":" characters")}

  function convert(){
    var t=input.value.replace(/\r\n?/g,"\n").replace(/\u00a0/g," ");
    if($("o-spaces").checked) t=t.replace(/[ \t]{2,}/g," ");
    if($("o-breaks").checked) t=t.replace(/\n{3,}/g,"\n\n");
    if($("o-lines").checked) t=t.replace(/\s*\n\s*/g," ");
    if($("o-trim").checked) t=t.split("\n").map(function(l){return l.replace(/[ \t]+$/,"")}).join("\n").trim();
    output.value=t;
    $("cin").textContent=count(input.value.length);
    $("cout").textContent=count(t.length);
  }

  // Force paste as plain text, ignoring clipboard HTML
  input.addEventListener("paste",function(e){
    var cd=e.clipboardData;
    if(!cd) return;
    e.preventDefault();
    var text=cd.getData("text/plain");
    var s=input.selectionStart,en=input.selectionEnd;
    input.setRangeText(text,s,en,"end");
    convert();
  });
  input.addEventListener("input",convert);
  ["o-trim","o-spaces","o-breaks","o-lines"].forEach(function(id){$(id).addEventListener("change",convert)});

  $("copy").addEventListener("click",function(){
    if(!output.value){say("There is no text to copy.");return}
    var done=function(){say("Text copied.")};
    var fallback=function(){
      output.removeAttribute("readonly");output.select();
      try{document.execCommand("copy");done()}catch(_){say("Couldn't copy. Select the text and press Ctrl+C.")}
      output.setAttribute("readonly","");output.setSelectionRange(0,0);
    };
    if(navigator.clipboard&&navigator.clipboard.writeText){
      navigator.clipboard.writeText(output.value).then(done,fallback);
    }else fallback();
  });

  $("paste").addEventListener("click",function(){
    if(!navigator.clipboard||!navigator.clipboard.readText){say("Your browser doesn't allow reading the clipboard. Use Ctrl+V.");return}
    navigator.clipboard.readText().then(function(t){input.value=t;convert();say("Text pasted.")},
      function(){say("Permission denied. Paste with Ctrl+V in the box above.")});
  });

  $("clear").addEventListener("click",function(){input.value="";convert();input.focus();say("Fields cleared.")});

  var mqDark=matchMedia("(prefers-color-scheme: dark)");
  function isDark(){
    var attr=document.documentElement.getAttribute("data-theme");
    return attr?attr==="dark":mqDark.matches;
  }
  function syncTheme(){
    var dark=isDark(),b=$("theme");
    b.classList.toggle("dark",dark);
    b.setAttribute("aria-label",dark?"Switch to light mode":"Switch to dark mode");
    b.setAttribute("title",dark?"Switch to light mode":"Switch to dark mode");
  }

  $("theme").addEventListener("click",function(){
    document.documentElement.setAttribute("data-theme",isDark()?"light":"dark");
    syncTheme();
  });
  if(mqDark.addEventListener) mqDark.addEventListener("change",syncTheme);
  else if(mqDark.addListener) mqDark.addListener(syncTheme);
  syncTheme();

  convert();
})();
</script>
</body>
</html>
